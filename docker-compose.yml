version: "3.8"

services:
  libraryapp:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    
    depends_on:
      mysql:
          condition: service_healthy
          
    restart: always

  mysql:
    image: mysql:8.0
    container_name: Library-mysql

    # ports:
    # - "3306:3306"

    env_file:
      - ./backend/.env

   
      

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

    

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: