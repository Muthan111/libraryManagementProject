services:
  mysql_test:
    image: mysql:8.0
    container_name: library-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: test_password
      MYSQL_DATABASE: library_test_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ptest_password"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - mysql_test_data:/var/lib/mysql

  redis_test:
    image: redis:7-alpine
    container_name: library-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data

volumes:
  mysql_test_data:
  redis_test_data:
